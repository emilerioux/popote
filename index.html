<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Popote</title>
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Popote">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css?v=6">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
</head>
<body>

<div class="app" id="app">
  <main class="pages">

    <!-- ── Semaine ── -->
    <section class="page" id="page-semaine" data-tab="semaine">
      <div class="page-bar"><span class="page-bar-title">Semaine</span></div>
      <div class="page-scroll">
        <div class="title-row">
          <h1 class="big-title">Semaine</h1>
          <button class="sync-pill" data-open-settings aria-label="Partage et réglages"></button>
        </div>
        <div class="week-nav">
          <button class="icon-btn" id="week-prev" aria-label="Semaine précédente">
            <svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>
          </button>
          <button class="week-label" id="week-label" aria-label="Revenir à cette semaine">
            <span class="week-range" id="week-range"></span>
            <span class="week-rel" id="week-rel"></span>
          </button>
          <button class="icon-btn" id="week-next" aria-label="Semaine suivante">
            <svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>
          </button>
        </div>
        <p class="week-sum" id="week-sum"></p>
        <div class="days" id="days"></div>
        <button class="tile-btn" id="fill-week">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
          Suggérer pour les jours vides
        </button>
      </div>
    </section>

    <!-- ── Recettes ── -->
    <section class="page" id="page-recettes" data-tab="recettes" hidden>
      <div class="page-bar"><span class="page-bar-title">Recettes</span></div>
      <div class="page-scroll">
        <div class="title-row">
          <h1 class="big-title">Recettes</h1>
          <button class="sync-pill" data-open-settings aria-label="Partage et réglages"></button>
        </div>
        <div class="tile-row top">
          <button class="tile-btn" id="new-recipe">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            Nouvelle
          </button>
          <button class="tile-btn" id="import-recipe">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19h14"/></svg>
            Importer
          </button>
        </div>
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
          <input id="rec-search" type="search" placeholder="Rechercher une recette ou un ingrédient" autocomplete="off">
        </label>
        <div class="filters" id="rec-filters"></div>
        <div class="rec-list" id="rec-list"></div>
      </div>
    </section>

    <!-- ── Épicerie ── -->
    <section class="page" id="page-epicerie" data-tab="epicerie" hidden>
      <div class="page-bar"><span class="page-bar-title">Épicerie</span></div>
      <div class="page-scroll">
        <div class="title-row">
          <h1 class="big-title">Épicerie</h1>
          <button class="sync-pill" data-open-settings aria-label="Partage et réglages"></button>
        </div>
        <p class="big-sub" id="groc-sub"></p>
        <div class="groc-hero" id="groc-hero" hidden>
          <svg class="ring" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="18"/><circle class="ring-fill" cx="22" cy="22" r="18" pathLength="100"/></svg>
          <div class="hero-left"><b id="hero-left"></b><small id="hero-left-sub"></small></div>
          <div class="hero-budget" id="groc-budget"></div>
        </div>
        <button class="primary-btn wide shop-btn" id="groc-shop" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2.2l2.3 11h10.8l2-8H6.4"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>
          Mode magasin
        </button>
        <form class="add-row" id="add-extra">
          <input id="extra-input" placeholder="Ajouter un article (ex. 2 l de lait)" autocomplete="off" enterkeyhint="done">
          <button class="add-btn" aria-label="Ajouter">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </form>
        <div id="groc-list"></div>
        <div class="groc-foot" id="groc-foot">
          <button class="ghost-btn" id="groc-pantry">Garde-manger</button>
          <button class="ghost-btn" id="groc-share">Partager</button>
          <button class="ghost-btn" id="groc-reset">Décocher</button>
        </div>
      </div>
    </section>

    <!-- ── Bilan ── -->
    <section class="page" id="page-bilan" data-tab="bilan" hidden>
      <div class="page-bar"><span class="page-bar-title">Bilan</span></div>
      <div class="page-scroll">
        <div class="title-row">
          <h1 class="big-title">Bilan</h1>
          <button class="sync-pill" data-open-settings aria-label="Partage et réglages"></button>
        </div>
        <div id="bilan"></div>
      </div>
    </section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="semaine">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Semaine</span>
    </button>
    <button class="tab" data-tab="recettes">
      <svg viewBox="0 0 24 24"><path d="M5 4.5h10.5a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10.5M9 8.5h6"/></svg>
      <span>Recettes</span>
    </button>
    <button class="tab" data-tab="epicerie">
      <svg viewBox="0 0 24 24"><path d="M3 4h2.2l2.3 11h10.8l2-8H6.4"/><circle cx="9.5" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg>
      <span>Épicerie</span>
      <b class="tab-badge" id="groc-badge" hidden></b>
    </button>
    <button class="tab" data-tab="bilan">
      <svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>
      <span>Bilan</span>
    </button>
  </nav>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js?v=6"></script>
<script>
  if ("serviceWorker" in navigator) {
    addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
</script>
</body>
</html>
